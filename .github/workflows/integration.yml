name: Integration tests

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  e2e:
    name: End-to-end with OpenSCAD
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Install OpenSCAD (development snapshot via snap)
        run: |
          sudo snap install openscad-nightly
          /snap/bin/openscad-nightly --version

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true

      # The openscad-nightly snap is strict-confined: it gets a private view
      # of /tmp, so pytest's default basetemp (under /tmp) is invisible to it.
      # Point TMPDIR at a path under $HOME, which the snap home plug exposes.
      - name: Run integration tests
        env:
          TMPDIR: ${{ runner.temp }}
        run: uv run tox -e integration -- -v
