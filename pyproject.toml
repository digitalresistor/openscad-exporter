[project]
name = "openscad-exporter"
version = "0.1.0"
description = "Bulk-export OpenSCAD models from CSV or customizer JSON parameter sets."
readme = "README.md"
license = "ISC"
license-files = ["LICENSE"]
authors = [
    { name = "Delta Regeer", email = "xistence@0x58.com" }
]
requires-python = ">=3.12"
keywords = ["openscad", "cad", "stl", "3d-printing", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Graphics :: 3D Modeling",
]
dependencies = [
    "click>=8.1",
    "rich>=13",
    "pydantic>=2",
]

[project.urls]
Homepage = "https://github.com/digitalresistor/openscad-exporter"
Issues = "https://github.com/digitalresistor/openscad-exporter/issues"

[project.scripts]
openscad-exporter = "openscad_exporter.cli:cli"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.10",
]

[build-system]
requires = ["uv_build>=0.11.12,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_decorators = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: tests that require a real openscad binary on PATH",
]
