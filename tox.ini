[tox]
requires =
    tox>=4.21
    tox-uv>=1.16
env_list =
    py312
    py313
    py314
    lint
    type

[testenv]
description = Run unit tests under {base_python}
runner = uv-venv-lock-runner
dependency_groups = dev
commands = pytest {posargs:-m "not integration"}

[testenv:lint]
description = Run ruff lint
runner = uv-venv-lock-runner
base_python = py312
dependency_groups = dev
commands = ruff check src tests

[testenv:type]
description = Run mypy
runner = uv-venv-lock-runner
base_python = py312
dependency_groups = dev
commands = mypy
